[package]
name = "modsync"
version = "0.1.0"
description = "ModSync desktop interface"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "modsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
flate2 = "1"
iroh = "0.29"
md-5 = "0.10"
precis-profiles = "=0.1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tauri-plugin-dialog = "2.6"
tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-opener = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package.sha2]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[package]
name = "valheim-mod-updater"
version = "1.0.8"
description = "Mod Updater"
authors = ["Frenvius"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
dirs = "5.0.1"
thiserror = "1.0"
serde_json = "1"
tracing = "0.1"
semver = "1.0"
whoami = "1.4.1"
html_parser = "0.7.0"
sysinfo = "=0.30.12"
tauri-plugin-fs = "2.0.0-beta"
tauri-plugin-shell = "2.0.0-beta"
tauri-plugin-dialog = "2.0.0-beta"
tauri-plugin-updater = "2.0.0-beta"
tauri-plugin-process = "2.0.0-beta"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.0.0-beta", features = [] }

# P2P/HTTP server dependencies
axum = "0.7"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"
reqwest = { version = "0.11", features = ["json", "stream", "gzip"] }
sha2 = "0.10"
hex = "0.4"
once_cell = "1.19"
futures = "0.3"
walkdir = "2.4"
zip = "0.6"

# Profile system dependencies
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
serde_yaml = "0.9"

[profile.dev]
# Faster dev builds
incremental = true
debug = 1

[profile.dev.package."*"]
# Optimize all dependencies for speed (they don't change often)
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

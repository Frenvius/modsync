[package]
name = "modsync"
version = "0.1.0"
description = "ModSync desktop interface"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "modsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-mcp-bridge = "0.13.0"
